% Phase 2.5 smoke test — does SU2 v8.4.0 run AIR-7 viscous without the
% v7.5.1 heap-corruption bug?
%
% v7.5.1 documented dead-end (CHECKPOINT_2026-04-26.md item 7):
%   "AIR-7 viscous heap corruption — internal SU2 v7.5.1 bug. Use inviscid."
%
% This cfg targets the existing v8_phase1A 2.74M-tet mesh (already on VM)
% and runs from the iter-251 warm-start. If v8 has the same bug it'll
% crash within ~10-20 iters on a pre-converged state. If it survives 100
% iters with finite residuals, the bug is gone and viscous AIR-7 on v8 is
% the path to closing the J&C 1972 sheath-ne gap that inviscid Euler
% cannot close.
%
% NOT a converged run — just a stability test. ITER=100, no convergence
% target, monitors RMS_MOMENTUM-X for any sign of NaN / heap corruption.

SOLVER= NEMO_NAVIER_STOKES
GAS_MODEL= AIR-7
GAS_COMPOSITION= (0.0, 0.77, 0.23, 0.0, 0.0, 0.0, 0.0)
MATH_PROBLEM= DIRECT
RESTART_SOL= YES
SOLUTION_FILENAME= solution.dat
FLUID_MODEL= SU2_NONEQ

% Freestream
MACH_NUMBER= 22.5
AOA= 0.0
SIDESLIP_ANGLE= 0.0
FREESTREAM_PRESSURE= 253.7116
FREESTREAM_TEMPERATURE= 242.6500
FREESTREAM_TEMPERATURE_VE= 242.6500
INIT_OPTION= TD_CONDITIONS
% NEMO solver computes species-level mu / k internally; ionized AIR-7
% requires Gupta-Yos transport (Wilke fails on ionized flows per SU2-NEMO).
TRANSPORT_COEFF_MODEL= GUPTA-YOS

% Boundary markers — switch from EULER (slip) to HEATFLUX (no-slip
% adiabatic). Adiabatic is more forgiving than isothermal for a smoke
% test; if it survives we'll try isothermal at T_wall=1500K.
MARKER_HEATFLUX= ( body, 0.0 )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( body )
MARKER_MONITORING= ( body )

% Numerics — same recipe as inviscid v8 phase1A
CONV_NUM_METHOD_FLOW= AUSMPLUSM
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VAN_ALBADA_EDGE
VENKAT_LIMITER_COEFF= 0.01
USE_ACCURATE_FLUX_JACOBIANS= YES
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
TIME_DISCRE_FLOW= EULER_IMPLICIT

% Conservative CFL — viscous BL-coupled chemistry is more brittle than
% inviscid. Start at 0.05; can be raised if smoke test passes cleanly.
CFL_NUMBER= 0.05
CFL_ADAPT= NO

% Linear solver
LINEAR_SOLVER= BCGSTAB
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 5

% Iteration cap — short. We're testing stability, not convergence.
ITER= 100
CONV_FIELD= ( RMS_MOMENTUM-X )
CONV_RESIDUAL_MINVAL= -15
CONV_STARTITER= 50

% Mesh — phase1A's 2.74M-tet refined RAM-C
MESH_FILENAME= ram_c_refined.su2
MESH_FORMAT= SU2

% Output — smaller cadence so we see early
CONV_FILENAME= history
VOLUME_FILENAME= flow
RESTART_FILENAME= restart
OUTPUT_WRT_FREQ= 10
OUTPUT_FILES= (RESTART, PARAVIEW)
