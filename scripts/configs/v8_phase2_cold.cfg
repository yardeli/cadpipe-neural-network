% RAM-C M=22.5 / 61 km / AIR-7, Phase 2 cold-start (Track B in CHECKPOINT_2026-04-26.md).
%
% Recipe inherited from /home/yarden/ram_c_runs/v8_phase1A_recover/run.cfg
% (the AUSMPLUSM run that held drag Cauchy-converged at 1e-3 from iter 100):
%   - AUSMPLUSM + MUSCL + VAN_ALBADA_EDGE + USE_ACCURATE_FLUX_JACOBIANS=YES
%   - RhoU monotonic over 600 iters in v8_phase1A; sub-cell shock breathing
%     bottomed RhoU at -0.2116 (iter 255). Refined mesh (5-10 cells across the
%     3 mm bow-shock standoff) is the fix per Phase 1's hypothesis ranking.
%
% Differences from phase1A_recover/run.cfg:
%   - RESTART_SOL=NO       (cold start; Track B 2B requires this)
%   - ITER=3000            (was 300; need full convergence not just iter limit)
%   - CFL_NUMBER=0.5       (was 0.1; v8+AUSMPLUSM is stable from cold per audit)
%   - CONV_FIELD adds DRAG_COEFFICIENT (Phase 1C: Cauchy[CD] is the right metric)
%   - CONV_CAUCHY_*        (drag Cauchy criterion as primary convergence test)
%
% Acceptance (Track B 2B in CHECKPOINT_2026-04-26.md §2.8):
%   RhoU <= -2 within 2000 iters AND drag Cauchy-converges to same value as
%   phase1A iter-251.

SOLVER= NEMO_EULER
GAS_MODEL= AIR-7
GAS_COMPOSITION= (0.0, 0.77, 0.23, 0.0, 0.0, 0.0, 0.0)
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
FLUID_MODEL= SU2_NONEQ

% Freestream conditions (RAM-C M22.5 / 61 km / J&C 1972)
MACH_NUMBER= 22.5
AOA= 0.0
SIDESLIP_ANGLE= 0.0
FREESTREAM_PRESSURE= 253.7116
FREESTREAM_TEMPERATURE= 242.6500
FREESTREAM_TEMPERATURE_VE= 242.6500
INIT_OPTION= TD_CONDITIONS

% Boundary markers (set by add_markers_su2.py)
MARKER_EULER= ( body )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( body )
MARKER_MONITORING= ( body )

% Numerics — AUSMPLUSM + MUSCL + accurate Jacobians (v8 best recipe)
CONV_NUM_METHOD_FLOW= AUSMPLUSM
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VAN_ALBADA_EDGE
VENKAT_LIMITER_COEFF= 0.01
USE_ACCURATE_FLUX_JACOBIANS= YES
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
TIME_DISCRE_FLOW= EULER_IMPLICIT

% CFL — phase1A used 0.1 with warm-start; cold-start v8+AUSMPLUSM is stable
% at 0.5 per AUDIT_M22_5_PATH_FORWARD §3.
CFL_NUMBER= 0.5
CFL_ADAPT= NO

% Linear solver
LINEAR_SOLVER= BCGSTAB
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 5

% Iterations + convergence
ITER= 3000
CONV_FIELD= ( RMS_MOMENTUM-X, DRAG_COEFFICIENT )
CONV_RESIDUAL_MINVAL= -15
CONV_STARTITER= 100
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-3

% Mesh (link or copy ram_c_tagged.su2 alongside the cfg)
MESH_FILENAME= ram_c_tagged.su2
MESH_FORMAT= SU2

% Output
CONV_FILENAME= history
VOLUME_FILENAME= flow
RESTART_FILENAME= restart
OUTPUT_WRT_FREQ= 50
OUTPUT_FILES= (RESTART, PARAVIEW)
