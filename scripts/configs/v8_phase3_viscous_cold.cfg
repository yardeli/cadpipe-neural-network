% RAM-C M=22.5 / 61 km / AIR-7 — Phase 3 viscous COLD START.
%
% This is the production viscous run, not the smoke test.
% Smoke verified SU2 v8.4.0 fixes the v7.5.1 AIR-7 viscous heap-corruption
% bug. This run starts from freestream (NOT from inviscid restart — that
% diverged in the smoke test) and uses CFL ramping to develop the BL
% naturally over many iters.
%
% Mesh: ram_c_v8_phase3_viscous tagged (5 um wall, BL prisms or fine
% threshold fallback). The whole point is to get y+ small enough that
% the wall-bound chemistry that J&C 1972 measured can be resolved.
%
% Acceptance:
%   - Drag Cauchy-converges (CONV_FIELD = DRAG_COEFFICIENT, eps=1e-3)
%   - Sheath p99 ne at z/L=0.14 station within factor of 5 of J&C 2e19
%     (Track A's iter-251 inviscid: factor of 250 under)
%   - No NaN, no heap corruption, no positive-residual excursions

SOLVER= NEMO_NAVIER_STOKES
GAS_MODEL= AIR-7
GAS_COMPOSITION= (0.0, 0.77, 0.23, 0.0, 0.0, 0.0, 0.0)
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
FLUID_MODEL= SU2_NONEQ
TRANSPORT_COEFF_MODEL= GUPTA-YOS

% Freestream
MACH_NUMBER= 22.5
AOA= 0.0
SIDESLIP_ANGLE= 0.0
FREESTREAM_PRESSURE= 253.7116
FREESTREAM_TEMPERATURE= 242.6500
FREESTREAM_TEMPERATURE_VE= 242.6500
INIT_OPTION= TD_CONDITIONS

% Boundary markers — viscous wall: no-slip + isothermal at 1500 K.
% Adiabatic was tried in smoke (HEATFLUX=0.0); for production we use
% a fixed cold wall to bound the BL chemistry. 1500 K is typical
% RAM-C-class re-entry surface temperature (NASA TM-X-2104 Apollo CM).
MARKER_ISOTHERMAL= ( body, 1500.0 )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( body )
MARKER_MONITORING= ( body )

% Numerics — same recipe as inviscid v8 phase1A
CONV_NUM_METHOD_FLOW= AUSMPLUSM
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VAN_ALBADA_EDGE
VENKAT_LIMITER_COEFF= 0.01
USE_ACCURATE_FLUX_JACOBIANS= YES
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
TIME_DISCRE_FLOW= EULER_IMPLICIT

% CFL ramp — viscous + chemistry coupled requires gentle start.
% Start at 0.01, let CFL_ADAPT grow it as residuals improve.
% Adaptation parameters from SU2 v8 NEMO defaults documented for blunt-body cases.
CFL_NUMBER= 0.01
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.5, 0.001, 1.0 )
% (factor_down, factor_up, cfl_min, cfl_max)
% Residual decreased -> CFL *= 1.5; residual grew -> CFL *= 0.5.

% Linear solver
LINEAR_SOLVER= BCGSTAB
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 5

% Iterations + convergence
% 2000 iter budget at 16 ranks ~ 15-25 hr wall on 4-8M cell mesh
% (viscous + chemistry ~30-60 sec/iter). Drag-Cauchy convergence
% expected before that based on Phase 1C result on inviscid.
ITER= 2000
CONV_FIELD= ( RMS_MOMENTUM-X, DRAG_COEFFICIENT )
CONV_RESIDUAL_MINVAL= -15
CONV_STARTITER= 100
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-3

% Mesh
MESH_FILENAME= ram_c_tagged.su2
MESH_FORMAT= SU2

% Output — sparse to manage disk
CONV_FILENAME= history
VOLUME_FILENAME= flow
RESTART_FILENAME= restart
OUTPUT_WRT_FREQ= 250
OUTPUT_FILES= (RESTART, PARAVIEW)
