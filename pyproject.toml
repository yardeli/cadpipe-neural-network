[project]
name = "plasmanet"
version = "0.1.0"
description = "Neural surrogate for hypersonic plasma prediction"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.optional-dependencies]
train = [
    "scipy>=1.10",
    "matplotlib>=3.7",
    "cantera>=3.0",
]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2",
    "boto3>=1.34,<2",
    "reportlab>=4",
    "pillow>=10",
]
agent = [
    "httpx>=0.27",
    "pydantic-ai>=0.0.13",
]
dev = [
    "pytest>=8",
    "pytest-httpserver>=1.0",
    "httpx>=0.27",
    "moto[batch]>=5",
    "pypdf>=4",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
]
all = [
    "plasmanet[train,serve,agent,dev]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
